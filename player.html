<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>LOTATO · Joueur</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:linear-gradient(145deg,#0f172a 0%,#1e293b 100%); padding-bottom:80px; min-height:100vh; }
        .app { max-width:550px; margin:0 auto; background:rgba(255,255,255,0.95); min-height:100vh; border-radius:0 0 32px 32px; overflow:hidden; box-shadow:0 25px 40px rgba(0,0,0,0.2); }
        .header { background:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%); color:white; padding:20px 22px 18px; position:sticky; top:0; z-index:20; border-bottom:1px solid rgba(255,255,255,0.2); }
        .header h1 { font-size:1.6rem; font-weight:700; display:flex; align-items:center; gap:10px; text-shadow:0 2px 5px rgba(0,0,0,0.2); }
        .balance-row { display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:0.9rem; }
        .balance { background:rgba(255,255,255,0.2); backdrop-filter:blur(4px); padding:5px 16px; border-radius:40px; font-weight:600; font-size:1rem; }
        .logout-btn { background:rgba(239,68,68,0.2); border:1px solid #ef4444; color:#fecaca; padding:5px 14px; border-radius:40px; cursor:pointer; font-weight:500; transition:0.2s; }
        .logout-btn:hover { background:#ef4444; color:white; }
        .carousel-container { background:#1e1b4b; border-radius:20px; margin:15px 15px 0; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,0.2); position:relative; height:180px; }
        .carousel-slides { display:flex; transition:transform 0.5s ease-in-out; height:100%; }
        .carousel-slide { min-width:100%; box-sizing:border-box; text-align:center; padding:8px; display:flex; align-items:center; justify-content:center; height:100%; }
        .carousel-slide img { height:160px; width:100%; border-radius:14px; object-fit:cover; }
        .carousel-indicators { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:5; }
        .carousel-dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.4); cursor:pointer; transition:0.3s; }
        .carousel-dot.active { background:white; width:20px; border-radius:4px; }
        .carousel-empty { height:160px; background:linear-gradient(135deg,#1e1b4b,#312e81); border-radius:20px; margin:15px 15px 0; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.35); font-size:0.85rem; }
        .carousel-text { background:linear-gradient(90deg,#1e1b4b,#312e81); color:#fde68a; font-weight:700; border-radius:30px; margin:10px 15px; overflow:hidden; height:38px; display:flex; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
        .marquee-inner { display:inline-block; white-space:nowrap; animation:marquee-ltr 18s linear infinite; padding-left:100%; font-size:0.88rem; } @keyframes marquee-ltr { from { transform:translateX(0); } to { transform:translateX(-100%); } }
        .tabs { display:flex; background:white; border-bottom:1px solid #e9edf2; position:sticky; top:84px; z-index:15; padding:0 12px; }
        .tab { flex:1; text-align:center; padding:14px 0 12px; font-weight:600; color:#6c7a91; cursor:pointer; border-bottom:3px solid transparent; transition:0.2s; }
        .tab.active { color:#3b82f6; border-bottom-color:#3b82f6; background:rgba(59,130,246,0.04); }
        .screen { display:none; padding:20px; background:#f8fafc; min-height:calc(100vh - 140px); }
        .screen.active { display:block; }
        .card { background:white; border-radius:28px; padding:20px; margin-bottom:20px; box-shadow:0 10px 20px rgba(0,0,0,0.05); transition:transform 0.1s ease; }
        .draws-scroll { display:flex; gap:12px; overflow-x:auto; padding:8px 2px 12px; scrollbar-width:thin; }
        .draw-chip { background:#f1f4f9; border-radius:60px; padding:8px 22px; white-space:nowrap; font-weight:600; cursor:pointer; border:1px solid #e2e8f0; transition:0.2s; }
        .draw-chip.active { background:#3b82f6; color:white; border-color:#3b82f6; box-shadow:0 4px 12px rgba(59,130,246,0.4); }
        .draw-chip.disabled { opacity:0.5; text-decoration:line-through; cursor:not-allowed; }
        .game-category { margin-bottom:20px; }
        .category-title { font-weight:700; margin-bottom:10px; color:#1e293b; }
        .sub-buttons { display:flex; flex-wrap:wrap; gap:10px; }
        .game-btn, .sub-btn { background:#f0f3f8; border:1px solid #e2e8f0; padding:6px 18px; border-radius:40px; font-size:0.8rem; font-weight:600; cursor:pointer; transition:0.2s; }
        .game-btn.active, .sub-btn.active { background:#3b82f6; color:white; border-color:#3b82f6; transform:scale(0.98); }
        .sub-btn.auto-chip { background:#fef9e3; border-color:#fbbf24; color:#b45309; }
        .options-panel { display:flex; gap:12px; margin:15px 0 10px; flex-wrap:wrap; }
        .option-chip { background:#eef2ff; padding:6px 18px; border-radius:40px; font-size:0.8rem; font-weight:500; cursor:pointer; }
        .option-chip.active { background:#3b82f6; color:white; }
        .bet-row { display:flex; gap:8px; margin:14px 0 8px; align-items:center; }
        .bet-row input { flex:1; min-width:0; padding:12px; border:1.5px solid #cbd5e1; border-radius:48px; font-size:0.9rem; text-align:center; }
        .btn-add-icon { background:#3b82f6; border:none; border-radius:50%; width:46px; height:46px; min-width:46px; display:flex; align-items:center; justify-content:center; color:white; font-size:1.6rem; cursor:pointer; transition:0.2s; flex-shrink:0; }
        .btn-add-icon:hover { background:#2563eb; transform:scale(1.05); }
        .cart-items { max-height:240px; overflow-y:auto; margin:15px 0; }
        .cart-item { background:#f8fafc; border-radius:60px; padding:10px 16px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border:1px solid #e2edf7; }
        .cart-total { background:#eef2ff; border-radius:60px; padding:12px; text-align:center; font-weight:800; margin:12px 0; }
        .btn-confirm { background:#10b981; width:100%; padding:14px; border-radius:60px; font-weight:800; border:none; color:white; cursor:pointer; transition:0.2s; }
        .btn-confirm:active { transform:scale(0.97); }
        .history-card, .result-card { background:white; border-radius:24px; padding:16px; margin-bottom:12px; border-left:5px solid #3b82f6; }
        .badge { display:inline-block; padding:4px 14px; border-radius:60px; font-size:0.7rem; font-weight:700; }
        .badge-win { background:#d1fae5; color:#065f46; }
        .badge-loss { background:#fee2e2; color:#991b1b; }
        .badge-wait { background:#fef3c7; color:#92400e; }
        .deposit-area { margin-top:20px; padding-top:16px; border-top:1px solid #eef2ff; display:flex; gap:12px; }
        .deposit-area input { flex:2; padding:12px; border-radius:60px; border:1px solid #cbd5e1; }
        .deposit-area button { flex:1; background:#10b981; border:none; border-radius:60px; color:white; font-weight:700; cursor:pointer; }
        .nx-panel { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; }
        .nx-digit { background:#eef2ff; padding:8px 18px; border-radius:40px; cursor:pointer; font-weight:700; }
        .error-msg { color:#dc2626; font-size:0.75rem; margin-top:8px; text-align:center; }
        .empty-msg { text-align:center; color:#6c7a91; padding:20px; }
        .day-filter-bar { display:flex; gap:8px; overflow-x:auto; padding:0 4px 10px; scrollbar-width:none; margin-bottom:4px; }
        .day-filter-bar::-webkit-scrollbar { display:none; }
        .day-chip { background:#f1f4f9; border:1px solid #e2e8f0; border-radius:40px; padding:7px 16px; font-size:0.78rem; font-weight:600; white-space:nowrap; cursor:pointer; transition:0.2s; color:#475569; }
        .day-chip.active { background:#312e81; color:white; border-color:#312e81; }
        .day-chip.old-chip { background:#fef9c3; border-color:#fbbf24; color:#92400e; }
        .day-chip.old-chip.active { background:#b45309; color:white; border-color:#b45309; }
        .day-chip.custom-chip { background:#ede9fe; border-color:#a78bfa; color:#5b21b6; }
        .day-chip.custom-chip.active { background:#7c3aed; color:white; border-color:#7c3aed; }
        .result-day-header { font-weight:700; color:#1e293b; font-size:0.85rem; margin:14px 0 8px; padding-left:4px; border-left:4px solid #3b82f6; padding-left:10px; }
        .result-card { border-left:5px solid #10b981; }
        .result-numbers { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
        .result-ball { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.9rem; }
        .ball-1 { background:#fef3c7; color:#92400e; border:2px solid #fbbf24; }
        .ball-2 { background:#dbeafe; color:#1e40af; border:2px solid #93c5fd; }
        .ball-3 { background:#fce7f3; color:#9d174d; border:2px solid #f9a8d4; }
        .ball-lotto3 { background:#f0fdf4; color:#14532d; border:2px solid #86efac; border-radius:10px; width:auto; padding:0 12px; }
        @keyframes shake { 0% { transform:translate(1px,1px) rotate(0deg); } 10% { transform:translate(-1px,-2px) rotate(-1deg); } 20% { transform:translate(-3px,0px) rotate(1deg); } 30% { transform:translate(3px,2px) rotate(0deg); } 40% { transform:translate(1px,-1px) rotate(1deg); } 50% { transform:translate(-1px,2px) rotate(-1deg); } 60% { transform:translate(-3px,1px) rotate(0deg); } 70% { transform:translate(3px,1px) rotate(-1deg); } 80% { transform:translate(-1px,-1px) rotate(1deg); } 90% { transform:translate(1px,2px) rotate(0deg); } 100% { transform:translate(1px,-2px) rotate(-1deg); } }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1><i class="fas fa-dice-d6"></i> <span id="lottery-name">LOTATO</span> · Joueur</h1>
        <div class="balance-row">
            <span><i class="fas fa-coins"></i> Mon solde</span>
            <span class="balance" id="headerBalance">0 G</span>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
        </div>
        <div id="slogan" style="font-size:0.75rem; margin-top:6px; opacity:0.8;"></div>
    </div>

    <div class="carousel-container" id="carouselContainer" style="display: none;">
        <div class="carousel-slides" id="carouselSlides"></div>
        <div class="carousel-indicators" id="carouselIndicators"></div>
    </div>
    <div class="carousel-empty" id="carouselEmpty" style="display:none;"><i class="fas fa-image" style="margin-right:8px;"></i> Espace publicitaire</div>
    <div class="carousel-text" id="announcementText" style="display: none;"></div>

    <div class="tabs">
        <div class="tab active" data-tab="play"><i class="fas fa-gamepad"></i> Jouer</div>
        <div class="tab" data-tab="history"><i class="fas fa-receipt"></i> Tickets</div>
        <div class="tab" data-tab="results"><i class="fas fa-trophy"></i> Résultats</div>
        <div class="tab" data-tab="profile"><i class="fas fa-user-circle"></i> Profil</div>
    </div>

    <div id="playScreen" class="screen active">
        <div class="card">
            <!-- Menu déroulant tirage -->
            <div style="font-weight:700; margin-bottom:10px;"><i class="fas fa-calendar-alt"></i> Tirage actif</div>
            <div style="position:relative;">
                <select id="drawsSelect" style="width:100%;padding:12px 16px;border-radius:40px;border:1.5px solid #e2e8f0;font-size:0.95rem;font-weight:600;background:#f8faff;color:#1e293b;appearance:none;cursor:pointer;outline:none;">
                    <option value="">— Choisir un tirage —</option>
                </select>
                <i class="fas fa-chevron-down" style="position:absolute;right:18px;top:50%;transform:translateY(-50%);pointer-events:none;color:#6c7a91;"></i>
            </div>
            <div id="drawsError" class="error-msg" style="display:none;"></div>
        </div>
        <div class="card">
            <!-- Menu déroulant jeu -->
            <div style="font-weight:700; margin-bottom:10px;"><i class="fas fa-dice"></i> Type de jeu</div>
            <div style="position:relative;">
                <select id="gameSelect" style="width:100%;padding:12px 16px;border-radius:40px;border:1.5px solid #e2e8f0;font-size:0.95rem;font-weight:600;background:#f8faff;color:#1e293b;appearance:none;cursor:pointer;outline:none;">
                    <optgroup label="🎯 Borlette">
                        <option value="borlette">Borlette</option>
                    </optgroup>
                    <optgroup label="🎲 Lotto">
                        <option value="lotto3">Lotto 3</option>
                        <option value="lotto4">Lotto 4</option>
                        <option value="lotto5">Lotto 5</option>
                        <option value="auto_lotto4">Auto Lotto 4</option>
                        <option value="auto_lotto5">Auto Lotto 5</option>
                    </optgroup>
                    <optgroup label="💍 Mariage">
                        <option value="mariage">Mariage</option>
                        <option value="auto_marriage">Auto Mariage</option>
                    </optgroup>
                    <optgroup label="✨ Spéciaux">
                        <option value="bo">BO</option>
                        <option value="grap">GRAP</option>
                        <option value="nx">Nx</option>
                    </optgroup>
                </select>
                <i class="fas fa-chevron-down" style="position:absolute;right:18px;top:50%;transform:translateY(-50%);pointer-events:none;color:#6c7a91;"></i>
            </div>
            <div id="optionsPanel" class="options-panel" style="margin-top:10px;"></div>
            <div id="nxPanel" class="nx-panel" style="display:none;margin-top:10px;"></div>
            <div class="bet-row" style="margin-top:12px;">
                <input type="text" id="betNumber" placeholder="Numéro" autocomplete="off">
                <input type="number" id="betAmount" placeholder="Montant G" autocomplete="off">
                <button class="btn-add-icon" id="addBtn">+</button>
            </div>
        </div>
        <div class="card">
            <div style="display:flex; justify-content:space-between;"><span><strong><i class="fas fa-shopping-cart"></i> Panier</strong> (<span id="cartCount">0</span>)</span><button id="clearCartBtn" style="background:#ef4444; padding:6px 18px; border-radius:40px; border:none; color:white;">Vider</button></div>
            <div class="cart-items" id="cartList"></div>
            <div class="cart-total">Total : <span id="cartTotal">0</span> G</div>
            <button id="confirmBtn" class="btn-confirm"><i class="fas fa-check-circle"></i> Confirmer et acheter</button>
        </div>
    </div>

    <div id="historyScreen" class="screen">
        <div class="day-filter-bar" id="historyDayBar"></div>
        <!-- Date personnalisée -->
        <div id="historyCustomDate" style="display:none; margin-bottom:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <input type="date" id="historyDatePicker" style="flex:1; padding:9px 14px; border:1.5px solid #cbd5e1; border-radius:40px; font-size:0.85rem; outline:none;">
            <button onclick="applyCustomDate()" style="background:#312e81; color:white; border:none; border-radius:40px; padding:9px 18px; font-weight:600; cursor:pointer; white-space:nowrap;">Voir</button>
        </div>
        <div id="historyStats" style="font-size:0.75rem;color:#6c7a91;text-align:center;margin-bottom:10px;"></div>
        <div id="historyContainer" class="empty-msg">Chargement...</div>
    </div>
    <div id="resultsScreen" class="screen">
        <div class="day-filter-bar" id="dayFilterBar"></div>
        <div id="resultsContainer" class="empty-msg">Chargement...</div>
    </div>
    <div id="profileScreen" class="screen">
        <div class="card">
            <p><i class="fas fa-user"></i> <strong>Nom :</strong> <span id="profileName"></span></p>
            <p><i class="fas fa-phone-alt"></i> <strong>Téléphone :</strong> <span id="profilePhone"></span></p>
            <div class="deposit-area">
                <input type="text" id="rechargeCode" placeholder="Code de recharge">
                <button id="rechargeBtn"><i class="fas fa-donate"></i> Recharger</button>
            </div>
            <div style="margin-top:18px; font-weight:700;"><i class="fas fa-wallet"></i> Solde : <span id="profileBalance" style="color:#10b981;">0 G</span></div>
        </div>
    </div>
</div>

<script>
    const API_BASE = window.location.origin + '/api';
    let token = localStorage.getItem('auth_token');
    let playerId = localStorage.getItem('player_id');
    if (!token || !playerId) window.location.href = 'index.html';

    let App = {
        selectedDrawId: null,
        selectedDrawName: "",
        cart: [],
        selectedGame: "borlette",
        lotto4Options: [true, true, true],
        lotto5Options: [true, true],
        playerBalance: 0,
        globalLimits: {},
        blockedNumbers: [],
        draws: []
    };

    let carouselInterval = null;
    let currentSlide = 0;
    let adsImages = [];

    async function apiFetch(endpoint, options = {}) {
        let res;
        try {
            res = await fetch(`${API_BASE}${endpoint}`, {
                ...options,
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...options.headers }
            });
        } catch(networkErr) {
            throw new Error('Impossible de joindre le serveur. Vérifie ta connexion.');
        }
        if (res.status === 401) { localStorage.clear(); window.location.href = 'index.html'; throw new Error('Session expirée'); }
        // Vérifier que la réponse est bien du JSON avant de parser
        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
            const text = await res.text();
            console.error(`Réponse non-JSON [${res.status}] pour ${endpoint}:`, text.slice(0, 200));
            throw new Error(`Erreur serveur (${res.status}) — réponse inattendue`);
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Erreur serveur (${res.status})`);
        return data;
    }

    async function refreshBalance() {
        try {
            const data = await apiFetch('/player/balance');
            App.playerBalance = data.balance;
            document.getElementById('headerBalance').innerText = App.playerBalance.toLocaleString() + " G";
            document.getElementById('profileBalance').innerHTML = App.playerBalance.toLocaleString() + " G";
        } catch(e) { console.error(e); }
    }

    async function loadDraws() {
        try {
            const data = await apiFetch('/draws');
            App.draws = data.draws;
            const select   = document.getElementById('drawsSelect');
            const errorDiv = document.getElementById('drawsError');
            if (!App.draws.length) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = 'Aucun tirage disponible';
                return;
            }
            errorDiv.style.display = 'none';
            // Peupler le select
            select.innerHTML = '<option value="">— Choisir un tirage —</option>' +
                App.draws.map(d => `
                    <option value="${d.id}" data-name="${d.name}" ${!d.active ? 'disabled' : ''}>
                        ${d.name} (${d.time.substring(0,5)}) ${!d.active ? '🔒' : ''}
                    </option>
                `).join('');
            // Auto-sélectionner le premier tirage actif
            if (!App.selectedDrawId) {
                const firstActive = App.draws.find(d => d.active);
                if (firstActive) {
                    App.selectedDrawId   = firstActive.id;
                    App.selectedDrawName = firstActive.name;
                    select.value = firstActive.id;
                }
            } else {
                select.value = App.selectedDrawId;
            }
            select.onchange = () => {
                const chosen = App.draws.find(d => d.id === parseInt(select.value));
                if (!chosen) { App.selectedDrawId = null; App.selectedDrawName = ''; return; }
                if (!chosen.active) {
                    alert("Tirage fermé (7 minutes avant l'heure)");
                    select.value = App.selectedDrawId || '';
                    return;
                }
                App.selectedDrawId   = chosen.id;
                App.selectedDrawName = chosen.name;
            };
        } catch(e) {
            console.error(e);
            document.getElementById('drawsError').innerText = 'Erreur chargement tirages';
            document.getElementById('drawsError').style.display = 'block';
        }
    }

    async function loadSettingsAndLimits() {
        try {
            const settings = await apiFetch('/player/settings');
            App.globalLimits = settings.globalLimits || {};
            App.blockedNumbers = settings.blockedNumbers || [];
            // Mettre à jour le nom et slogan
            document.getElementById('lottery-name').innerText = settings.name || 'LOTATO';
            document.getElementById('slogan').innerText = settings.slogan || '';
            // Carrousel et annonces
            adsImages = settings.adsImages || [];
            const announcement = settings.announcements || "";
            const carouselDiv = document.getElementById('carouselContainer');
            const slidesDiv = document.getElementById('carouselSlides');
            const indicatorsDiv = document.getElementById('carouselIndicators');
            const emptyDiv = document.getElementById('carouselEmpty');
            const textDiv = document.getElementById('announcementText');
            if (adsImages.length > 0) {
                carouselDiv.style.display = 'block';
                emptyDiv.style.display = 'none';
                slidesDiv.innerHTML = adsImages.map(url => `<div class="carousel-slide"><img src="${url}" alt="pub" onerror="this.style.display='none'"></div>`).join('');
                // Créer les indicateurs
                indicatorsDiv.innerHTML = adsImages.map((_, i) => `<div class="carousel-dot ${i===0?'active':''}" data-idx="${i}"></div>`).join('');
                document.querySelectorAll('.carousel-dot').forEach(dot => {
                    dot.addEventListener('click', () => {
                        currentSlide = parseInt(dot.dataset.idx);
                        slidesDiv.style.transform = `translateX(-${currentSlide * 100}%)`;
                        document.querySelectorAll('.carousel-dot').forEach(d => d.classList.remove('active'));
                        dot.classList.add('active');
                    });
                });
                if (carouselInterval) clearInterval(carouselInterval);
                carouselInterval = setInterval(() => {
                    currentSlide = (currentSlide + 1) % adsImages.length;
                    slidesDiv.style.transform = `translateX(-${currentSlide * 100}%)`;
                    document.querySelectorAll('.carousel-dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
                }, 4000);
            } else {
                carouselDiv.style.display = 'none';
                emptyDiv.style.display = 'flex';
            }
            if (announcement && announcement.trim() !== "") {
                textDiv.style.display = 'flex';
                textDiv.innerHTML = `<div class="marquee-inner">${announcement} &nbsp;&nbsp;&nbsp; ${announcement} &nbsp;&nbsp;&nbsp; ${announcement}</div>`;
            } else {
                textDiv.style.display = 'none';
            }
        } catch(e) { console.error(e); }
    }

    function generateAutoBets(game, amount, nxDigit = null) {
        let bets = [];
        if (game === 'bo') {
            for (let i=0;i<=9;i++) bets.push({ game:'borlette', cleanNumber:i+''+i, displayNumber:i+''+i, amount });
        } else if (game === 'grap') {
            for (let i=0;i<=9;i++) bets.push({ game:'lotto3', cleanNumber:i+''+i+''+i, displayNumber:i+''+i+''+i, amount });
        } else if (game === 'nx' && nxDigit !== null) {
            for (let t=0;t<=9;t++) bets.push({ game:'borlette', cleanNumber:t+''+nxDigit, displayNumber:t+''+nxDigit, amount });
        } else if (game === 'auto_marriage') {
            const borlettes = App.cart.filter(b => b.game === 'borlette' && b.cleanNumber.length===2).map(b=>b.cleanNumber);
            const uniq = [...new Set(borlettes)];
            for(let i=0;i<uniq.length;i++) for(let j=i+1;j<uniq.length;j++) bets.push({ game:'mariage', cleanNumber:uniq[i]+'&'+uniq[j], displayNumber:uniq[i]+'&'+uniq[j], amount });
        } else if (game === 'auto_lotto4') {
            const borlettes = App.cart.filter(b => b.game === 'borlette' && b.cleanNumber.length===2).map(b=>b.cleanNumber);
            const uniq = [...new Set(borlettes)];
            for(let i=0;i<uniq.length;i++) for(let j=0;j<uniq.length;j++) if(i!==j) bets.push({ game:'lotto4', cleanNumber:uniq[i]+uniq[j], displayNumber:uniq[i]+'-'+uniq[j], amount });
        } else if (game === 'auto_lotto5') {
            const lotto3s = App.cart.filter(b => b.game === 'lotto3' && b.cleanNumber.length===3).map(b=>b.cleanNumber);
            const uniq = [...new Set(lotto3s)];
            for(let i=0;i<uniq.length;i++) for(let j=0;j<uniq.length;j++) if(i!==j) bets.push({ game:'lotto5', cleanNumber:uniq[i]+uniq[j].slice(-2), displayNumber:uniq[i]+'-'+uniq[j].slice(-2), amount });
        }
        return bets;
    }

    let pendingNxDigit = null;

    function addBet() {
        if (!App.selectedDrawId) { alert("Sélectionnez un tirage actif"); return; }
        let rawNumber = document.getElementById('betNumber').value.trim();
        let amount = parseFloat(document.getElementById('betAmount').value);
        if (isNaN(amount) || amount <= 0) { alert("Montant valide requis"); return; }
        let game = App.selectedGame;
        let currentTotal = App.cart.reduce((s,b)=>s+b.amount,0) + amount;
        if (currentTotal > App.playerBalance) { alert(`Solde insuffisant. Vous avez ${App.playerBalance} G.`); return; }

        const checkGlobalLimit = (num2d) => {
            let limit = App.globalLimits[num2d];
            if (limit) {
                let already = App.cart.filter(b => b.game==='borlette' && b.cleanNumber===num2d).reduce((s,b)=>s+b.amount,0);
                if (already + amount > limit) { alert(`Limite atteinte pour ${num2d} : max ${limit} G`); return false; }
            }
            return true;
        };

        let clean = rawNumber.replace(/[^0-9&]/g, '');

        if (['bo','grap','auto_marriage','auto_lotto4','auto_lotto5'].includes(game)) {
            let autoBets = generateAutoBets(game, amount);
            if (autoBets.length===0) { alert("Aucune combinaison générée"); return; }
            for(let bet of autoBets) App.cart.push({ id:Date.now()+Math.random(), game:bet.game, cleanNumber:bet.cleanNumber, displayNumber:bet.displayNumber, amount:bet.amount });
            renderCart();
            document.getElementById('betNumber').value = '';
            document.getElementById('betAmount').value = '';
            return;
        }
        if (game === 'nx') {
            if (pendingNxDigit === null) { alert("Choisissez un chiffre Nx (0-9)"); return; }
            let autoBets = generateAutoBets('nx', amount, pendingNxDigit);
            for(let bet of autoBets) App.cart.push({ id:Date.now()+Math.random(), game:bet.game, cleanNumber:bet.cleanNumber, displayNumber:bet.displayNumber, amount:bet.amount });
            renderCart();
            document.getElementById('betNumber').value = '';
            document.getElementById('betAmount').value = '';
            pendingNxDigit = null;
            document.getElementById('nxPanel').style.display = 'none';
            return;
        }

        if (game === 'borlette') {
            if (!/^\d{2}$/.test(clean)) { alert("Borlette : 2 chiffres"); return; }
            if (App.blockedNumbers.includes(clean)) { alert(`Numéro ${clean} bloqué`); return; }
            if (!checkGlobalLimit(clean)) return;
            App.cart.push({ id:Date.now()+Math.random(), game, cleanNumber:clean, displayNumber:clean, amount });
        } else if (game === 'lotto3') {
            if (!/^\d{3}$/.test(clean)) { alert("Lotto3 : 3 chiffres"); return; }
            App.cart.push({ id:Date.now()+Math.random(), game, cleanNumber:clean, displayNumber:clean, amount });
        } else if (game === 'lotto4') {
            if (!/^\d{4}$/.test(clean)) { alert("Lotto4 : 4 chiffres"); return; }
            const opts = App.lotto4Options;
            if (!opts[0] && !opts[1] && !opts[2]) { alert("Choisissez au moins une option Lotto4"); return; }
            for(let i=0;i<opts.length;i++) if(opts[i]) App.cart.push({ id:Date.now()+Math.random(), game, cleanNumber:clean, displayNumber:clean.slice(0,2)+'-'+clean.slice(2,4), amount, option:i+1 });
        } else if (game === 'lotto5') {
            if (!/^\d{5}$/.test(clean)) { alert("Lotto5 : 5 chiffres"); return; }
            const opts = App.lotto5Options;
            if (!opts[0] && !opts[1]) { alert("Choisissez au moins une option Lotto5"); return; }
            for(let i=0;i<opts.length;i++) if(opts[i]) App.cart.push({ id:Date.now()+Math.random(), game, cleanNumber:clean, displayNumber:clean.slice(0,3)+'-'+clean.slice(3,5), amount, option:i+1 });
        } else if (game === 'mariage') {
            if (!/^\d{2}&\d{2}$/.test(clean)) { alert("Mariage : format 12&34"); return; }
            App.cart.push({ id:Date.now()+Math.random(), game, cleanNumber:clean, displayNumber:clean, amount });
        } else { alert("Jeu non reconnu"); return; }
        renderCart();
        document.getElementById('betNumber').value = '';
        document.getElementById('betAmount').value = '';
    }

    function renderCart() {
        const container = document.getElementById('cartList');
        let total = 0;
        container.innerHTML = '';
        App.cart.forEach((item, idx) => {
            total += item.amount;
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `<span><strong>${item.game.toUpperCase()}</strong> ${item.displayNumber}</span><span>${item.amount} G</span><button data-idx="${idx}" class="removeCartItem" style="background:#ef4444; padding:4px 12px; border-radius:40px;">✖</button>`;
            container.appendChild(div);
        });
        document.getElementById('cartTotal').innerText = total;
        document.getElementById('cartCount').innerText = App.cart.length;
        document.querySelectorAll('.removeCartItem').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.dataset.idx);
                App.cart.splice(idx, 1);
                renderCart();
            });
        });
    }

    async function checkout() {
        if (!App.selectedDrawId) { alert("Choisissez un tirage"); return; }
        if (App.cart.length === 0) { alert("Panier vide"); return; }
        const total = App.cart.reduce((s,b)=>s+b.amount,0);
        if (App.playerBalance < total) { alert("Solde insuffisant"); return; }
        const bets = App.cart.map(b => ({ game: b.game, number: b.cleanNumber, amount: b.amount, option: b.option || null }));
        try {
            const data = await apiFetch('/player/tickets/save', {
                method: 'POST',
                body: JSON.stringify({ drawId: App.selectedDrawId, drawName: App.selectedDrawName, bets, totalAmount: total })
            });
            if (data.success) {
                App.cart = [];
                renderCart();
                await refreshBalance();
                alert(`✅ Achat validé ! ${total} G débités. Ticket #${data.ticketId}`);
                loadHistory();
            } else alert("Erreur achat");
        } catch (err) { alert("Erreur: " + err.message); }
    }

    let _allTickets = [];
    let _historyDay = null; // 'YYYY-MM-DD' | 'old' | 'custom'
    let _customDate = null; // 'YYYY-MM-DD' quand mode custom

    function histDayKey(dateStr) {
        const d = new Date(new Date(dateStr).getTime() - 5 * 3600 * 1000);
        return d.toISOString().slice(0, 10);
    }

    function histDayLabel(key) {
        const todayKey = histDayKey(new Date().toISOString());
        const yest = new Date(); yest.setDate(yest.getDate() - 1);
        const yesterdayKey = histDayKey(yest.toISOString());
        if (key === todayKey) return "Aujourd'hui";
        if (key === yesterdayKey) return 'Hier';
        const d = new Date(key + 'T12:00:00');
        return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function renderHistory() {
        const container = document.getElementById('historyContainer');
        const statsEl   = document.getElementById('historyStats');
        const customDiv = document.getElementById('historyCustomDate');

        // Montrer/masquer le date picker
        customDiv.style.display = _historyDay === 'custom' ? 'flex' : 'none';

        let filtered;
        if (_historyDay === 'old') {
            const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
            filtered = _allTickets.filter(t => new Date(t.date) < cutoff);
        } else if (_historyDay === 'custom') {
            const target = _customDate || histDayKey(new Date().toISOString());
            filtered = _allTickets.filter(t => histDayKey(t.date) === target);
        } else {
            filtered = _allTickets.filter(t => histDayKey(t.date) === _historyDay);
        }

        const totalMise = filtered.reduce((s, t) => s + parseFloat(t.total_amount || 0), 0);
        const totalGain = filtered.reduce((s, t) => s + parseFloat(t.win_amount   || 0), 0);
        statsEl.innerHTML = filtered.length
            ? `${filtered.length} ticket(s) · Mises : <strong>${totalMise.toLocaleString()} G</strong> · Gains : <strong style="color:#10b981;">${totalGain.toLocaleString()} G</strong>`
            : '';

        if (!filtered.length) {
            container.innerHTML = '<div class="empty-msg"><i class="fas fa-ticket-alt"></i><br>Aucun ticket pour cette période</div>';
            return;
        }
        container.innerHTML = filtered.map(t => {
            const win = parseFloat(t.win_amount) || 0;
            let statusBadge = !t.checked
                ? '<span class="badge badge-wait">⏳ En attente</span>'
                : (win > 0
                    ? `<span class="badge badge-win">🏆 Gagné ${win.toLocaleString()} G</span>`
                    : '<span class="badge badge-loss">❌ Perdu</span>');
            const betsArray = Array.isArray(t.bets) ? t.bets : [];
            const preview = betsArray.slice(0, 3).map(b =>
                `<span style="background:#eef2ff;padding:2px 8px;border-radius:20px;font-size:0.7rem;">${b.game} <strong>${b.number || b.cleanNumber}</strong></span>`
            ).join(' ');
            const moreCount = betsArray.length > 3
                ? `<span style="font-size:0.7rem;color:#6c7a91;">+${betsArray.length - 3} autres</span>` : '';
            return `<div class="history-card">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
                    <strong>${t.draw_name}</strong> ${statusBadge}
                </div>
                <div style="font-size:0.72rem;color:#6c7a91;margin:4px 0;">
                    🎫 Ticket #${t.ticket_id || t.id} &nbsp;·&nbsp; 📅 ${new Date(t.date).toLocaleString()}
                </div>
                <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;">${preview}${moreCount}</div>
                <div style="margin-top:6px;font-weight:700;">💰 Mise : ${parseFloat(t.total_amount).toLocaleString()} G ${win > 0 ? `<span style="color:#10b981;">→ Gain : ${win.toLocaleString()} G</span>` : ''}</div>
            </div>`;
        }).join('');
    }

    function applyCustomDate() {
        const picker = document.getElementById('historyDatePicker');
        if (!picker.value) return;
        _customDate = picker.value; // YYYY-MM-DD
        renderHistory();
    }

    async function loadHistory() {
        const container = document.getElementById('historyContainer');
        const barEl     = document.getElementById('historyDayBar');
        const statsEl   = document.getElementById('historyStats');
        container.innerHTML = '<div class="empty-msg"><i class="fas fa-spinner fa-spin"></i> Chargement...</div>';
        barEl.innerHTML = '';
        statsEl.innerHTML = '';
        try {
            const data = await apiFetch('/player/tickets');
            _allTickets = data.tickets || [];

            if (!_allTickets.length) {
                container.innerHTML = '<div class="empty-msg"><i class="fas fa-ticket-alt"></i><br>Aucun ticket pour le moment</div>';
                return;
            }

            // 7 derniers jours
            const today = new Date();
            const days = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(today); d.setDate(today.getDate() - i);
                const key = histDayKey(d.toISOString());
                if (!days.includes(key)) days.push(key);
            }

            const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
            const hasOld = _allTickets.some(t => new Date(t.date) < cutoff);

            if (!_historyDay || (_historyDay !== 'old' && _historyDay !== 'custom' && !days.includes(_historyDay))) {
                _historyDay = days[0];
            }

            // Chips jours
            barEl.innerHTML = days.map(key => {
                const count = _allTickets.filter(t => histDayKey(t.date) === key).length;
                return `<div class="day-chip ${key === _historyDay ? 'active' : ''}" data-hday="${key}">
                    ${histDayLabel(key)} <span style="font-size:0.7rem;opacity:0.7;">(${count})</span>
                </div>`;
            }).join('');

            // Bouton Plus anciens
            if (hasOld) {
                const oldCount = _allTickets.filter(t => new Date(t.date) < cutoff).length;
                barEl.innerHTML += `<div class="day-chip old-chip ${_historyDay === 'old' ? 'active' : ''}" data-hday="old">
                    📦 Anciens <span style="font-size:0.7rem;opacity:0.7;">(${oldCount})</span>
                </div>`;
            }

            // Bouton Date personnalisée
            barEl.innerHTML += `<div class="day-chip custom-chip ${_historyDay === 'custom' ? 'active' : ''}" data-hday="custom">
                📅 Date perso
            </div>`;

            barEl.querySelectorAll('.day-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    _historyDay = chip.dataset.hday;
                    barEl.querySelectorAll('.day-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    if (_historyDay === 'custom') {
                        // Mettre la date d'aujourd'hui par défaut dans le picker
                        const picker = document.getElementById('historyDatePicker');
                        if (!picker.value) picker.value = histDayKey(new Date().toISOString());
                        _customDate = picker.value;
                    }
                    renderHistory();
                });
            });

            renderHistory();
        } catch(e) {
            console.error(e);
            container.innerHTML = '<div class="empty-msg" style="color:#dc2626;"><i class="fas fa-exclamation-circle"></i><br>Erreur chargement tickets.<br><small>' + e.message + '</small></div>';
        }
    }

    let allResults = [];
    let selectedDay = null;

    function getDayLabel(dateKey) {
        // dateKey = "YYYY-MM-DD"
        const today = new Date();
        const todayKey = today.toISOString().slice(0, 10);
        const yest = new Date(today); yest.setDate(today.getDate() - 1);
        const yesterdayKey = yest.toISOString().slice(0, 10);
        if (dateKey === todayKey) return "Aujourd'hui";
        if (dateKey === yesterdayKey) return "Hier";
        const d = new Date(dateKey + 'T12:00:00');
        return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function getDayKey(dateStr) {
        // Convertir en heure locale Haiti pour grouper correctement
        const d = new Date(dateStr);
        const offset = -5; // Haiti UTC-5
        const local = new Date(d.getTime() + offset * 60 * 60 * 1000);
        return local.toISOString().slice(0, 10);
    }

    function renderResults() {
        const container = document.getElementById('resultsContainer');
        const filtered = selectedDay
            ? allResults.filter(r => getDayKey(r.date) === selectedDay)
            : [];

        if (!filtered.length) {
            container.innerHTML = '<div class="empty-msg"><i class="fas fa-trophy" style="font-size:2rem;opacity:0.2;"></i><br>Aucun résultat pour ce jour</div>';
            return;
        }

        let html = '';
        filtered.forEach(r => {
            const nums = Array.isArray(r.numbers) ? r.numbers : [];
            const time = new Date(r.date).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            html += `<div class="result-card">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <strong style="color:#1e293b;">${r.name}</strong>
                    <span style="font-size:0.75rem;color:#6c7a91;">🕐 ${time}</span>
                </div>
                <div class="result-numbers">
                    <div class="result-ball ball-1" title="1er lot">${nums[0] || '--'}</div>
                    <div class="result-ball ball-2" title="2e lot">${nums[1] || '--'}</div>
                    <div class="result-ball ball-3" title="3e lot">${nums[2] || '--'}</div>
                    <div class="result-ball ball-lotto3" title="Lotto3">L3: ${r.lotto3 || '---'}</div>
                </div>
                <div style="font-size:0.7rem;color:#94a3b8;margin-top:6px;">1er · 2e · 3e lot</div>
            </div>`;
        });
        container.innerHTML = html;
    }

    async function loadResults() {
        const container = document.getElementById('resultsContainer');
        const filterBar = document.getElementById('dayFilterBar');
        container.innerHTML = '<div class="empty-msg"><i class="fas fa-spinner fa-spin"></i> Chargement...</div>';
        filterBar.innerHTML = '';
        try {
            const data = await apiFetch('/winners/results');
            allResults = data.results || [];

            if (!allResults.length) {
                container.innerHTML = '<div class="empty-msg"><i class="fas fa-trophy" style="font-size:2rem;opacity:0.2;"></i><br>Aucun résultat publié</div>';
                return;
            }

            // Extraire les jours uniques qui ont des résultats (max 7)
            const seenDays = [];
            allResults.forEach(r => {
                const key = getDayKey(r.date);
                if (!seenDays.includes(key)) seenDays.push(key);
            });
            const days = seenDays.slice(0, 7); // 7 derniers jours avec résultats

            // Sélectionner le jour le plus récent par défaut
            if (!selectedDay || !days.includes(selectedDay)) {
                selectedDay = days[0];
            }

            filterBar.innerHTML = days.map(key =>
                `<div class="day-chip ${key === selectedDay ? 'active' : ''}" data-day="${key}">${getDayLabel(key)}</div>`
            ).join('');

            document.querySelectorAll('.day-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    selectedDay = chip.dataset.day;
                    document.querySelectorAll('.day-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    renderResults();
                });
            });

            renderResults();
        } catch(e) {
            console.error(e);
            container.innerHTML = `<div class="empty-msg" style="color:#dc2626;"><i class="fas fa-exclamation-circle"></i><br>Erreur chargement résultats<br><small>${e.message}</small></div>`;
        }
    }

    function initGameSelectors() {
        const gameSelect = document.getElementById('gameSelect');
        // Initialiser avec borlette
        App.selectedGame = gameSelect.value || 'borlette';
        updateOptionsAndInput();

        gameSelect.addEventListener('change', () => {
            const game = gameSelect.value;
            if (game === 'nx') {
                // Afficher le panel Nx pour choisir le chiffre
                const panel = document.getElementById('nxPanel');
                panel.innerHTML = '';
                for (let d = 0; d <= 9; d++) {
                    const digitDiv = document.createElement('div');
                    digitDiv.className = 'nx-digit';
                    digitDiv.innerText = d;
                    digitDiv.onclick = () => {
                        pendingNxDigit = d;
                        App.selectedGame = `n${d}`;
                        panel.style.display = 'none';
                        updateOptionsAndInput();
                        alert(`Jeu N${d} sélectionné : tous les numéros se terminant par ${d}`);
                    };
                    panel.appendChild(digitDiv);
                }
                panel.style.display = 'flex';
                return;
            }
            App.selectedGame = game;
            document.getElementById('nxPanel').style.display = 'none';
            updateOptionsAndInput();
        });
    }

    function updateOptionsAndInput() {
        const panel = document.getElementById('optionsPanel');
        const numInput = document.getElementById('betNumber');
        document.getElementById('nxPanel').style.display = 'none';
        pendingNxDigit = null;

        if (App.selectedGame === 'lotto4') {
            panel.innerHTML = `<div class="option-chip ${App.lotto4Options[0]?'active':''}" data-opt="0">Opt1 (12&34)</div>
                               <div class="option-chip ${App.lotto4Options[1]?'active':''}" data-opt="1">Opt2 (23&45)</div>
                               <div class="option-chip ${App.lotto4Options[2]?'active':''}" data-opt="2">Opt3 (13&46)</div>`;
            document.querySelectorAll('.option-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    let idx = parseInt(chip.dataset.opt);
                    App.lotto4Options[idx] = !App.lotto4Options[idx];
                    updateOptionsAndInput();
                });
            });
        } else if (App.selectedGame === 'lotto5') {
            panel.innerHTML = `<div class="option-chip ${App.lotto5Options[0]?'active':''}" data-opt="0">Opt1 (123&45)</div>
                               <div class="option-chip ${App.lotto5Options[1]?'active':''}" data-opt="1">Opt2 (123&46)</div>`;
            document.querySelectorAll('.option-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    let idx = parseInt(chip.dataset.opt);
                    App.lotto5Options[idx] = !App.lotto5Options[idx];
                    updateOptionsAndInput();
                });
            });
        } else {
            panel.innerHTML = '';
        }

        if (['bo','grap','auto_marriage','auto_lotto4','auto_lotto5','nx'].includes(App.selectedGame) || App.selectedGame.startsWith('n')) {
            numInput.disabled = true;
            numInput.placeholder = 'Auto';
        } else {
            numInput.disabled = false;
            if (App.selectedGame === 'lotto3') numInput.maxLength = 3;
            else if (App.selectedGame === 'lotto4') numInput.maxLength = 4;
            else if (App.selectedGame === 'lotto5') numInput.maxLength = 5;
            else if (App.selectedGame === 'borlette') numInput.maxLength = 2;
            else if (App.selectedGame === 'mariage') numInput.maxLength = 4;
            else numInput.maxLength = 10;
            numInput.placeholder = 'Numéro';
        }
    }

    function setupAutoFocus() {
        const numInput = document.getElementById('betNumber');
        const amtInput = document.getElementById('betAmount');
        numInput.addEventListener('input', () => {
            let maxLen = 2;
            if (App.selectedGame === 'lotto3') maxLen = 3;
            else if (App.selectedGame === 'lotto4') maxLen = 4;
            else if (App.selectedGame === 'lotto5') maxLen = 5;
            else if (App.selectedGame === 'borlette') maxLen = 2;
            else if (App.selectedGame === 'mariage') maxLen = 4;
            if (maxLen > 0 && numInput.value.length >= maxLen) amtInput.focus();
        });
        amtInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addBet(); });
    }

    }

    function logout() { localStorage.clear(); window.location.href = 'index.html'; }

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            const target = tab.dataset.tab;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`${target}Screen`).classList.add('active');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            if (target === 'history') loadHistory();
            if (target === 'results') loadResults();
            if (target === 'profile') refreshProfile();
        });
    });

    document.getElementById('addBtn').addEventListener('click', addBet);
    document.getElementById('confirmBtn').addEventListener('click', checkout);
    document.getElementById('clearCartBtn').addEventListener('click', () => { App.cart = []; renderCart(); });
    document.getElementById('rechargeBtn').addEventListener('click', rechargeWithCode);
    document.getElementById('logoutBtn').addEventListener('click', logout);

    (async function init() {
        // Afficher le placeholder carrousel dès le départ
        document.getElementById('carouselEmpty').style.display = 'flex';
        await refreshProfile();
        await loadDraws();
        await loadSettingsAndLimits();
        initGameSelectors();
        setupAutoFocus();
        loadHistory();
        loadResults();
    })();
</script>
</body>
</html>
